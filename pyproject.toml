[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "latex-resume"
version = "1.0.0"
description = "Gerador Automático de Currículos LaTeX / Automatic LaTeX Resume Generator (Multi-Provider AI: NVIDIA NIM, Gemini, Claude, OpenAI, DeepSeek)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "João Lucas Mayrinck" }
]
keywords = [
    "latex",
    "resume",
    "curriculo",
    "llm",
    "nvidia-nim",
    "gemini",
    "claude",
    "openai",
    "deepseek",
    "pdf-generator",
    "token-saving",
    "zero-storage"
]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "Pillow>=10.0.0",
    "streamlit>=1.32.0",
    "pypdf>=4.0.0",
    "flask>=3.0.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "anyio>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
